# ===================================================================
# SKINVIET_MYPHAM SHOP COSMETICS CHAIN STORE CONFIGURATION
# Phân chia: Thành viên 1 thiết lập cấu hình hệ thống
# ===================================================================
server.port=8080
spring.application.name=skinviet-mypham-shop

# -------------------------------------------------------------------
# DATABASE CONFIGURATION
# Mặc định sử dụng H2 in-memory Database để chạy được ngay lập tức (không cần cài MySQL trước).
# Khi muốn chuyển sang MySQL, chỉ cần bỏ comment các dòng cấu hình MySQL bên dưới!
# -------------------------------------------------------------------
# [TÙY CHỌN 1: H2 In-Memory - Chạy ngay khi bấm Run]
spring.datasource.url=jdbc:h2:mem:oneshopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# [TÙY CHỌN 2: MySQL - Khi đã cài MySQL]
# spring.datasource.url=jdbc:mysql://localhost:3306/oneshop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=123456
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Khởi tạo dữ liệu mẫu từ data.sql khi start server
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Hiển thị chi tiết lỗi khi có ngoại lệ
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# -------------------------------------------------------------------
# THYMELEAF CONFIGURATION
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# FILE UPLOAD LIMITS (Cho phép upload ảnh mỹ phẩm lên tới 20MB)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

