<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản Lý Chi Nhánh Chuỗi SkinViet_MyPham Shop</title>
</head>
<body>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold m-0"><i class="fa-solid fa-store text-danger me-2"></i>Hệ Thống Chi Nhánh Cửa Hàng</h4>
            <p class="text-muted small m-0">Quản lý mạng lưới các chi nhánh SkinViet_MyPham Shop trên toàn quốc</p>
        </div>
        <a th:href="@{/admin/branches/create}" class="btn btn-danger btn-sm rounded-pill px-3">
            <i class="fa-solid fa-plus me-1"></i> Thêm Chi Nhánh Mới
        </a>
    </div>

    <!-- Alert -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
        <span th:text="${successMessage}">Thành công</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light small text-muted">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Tên Chi Nhánh</th>
                        <th>Địa Chỉ Cửa Hàng</th>
                        <th>Số Điện Thoại</th>
                        <th>Khu Vực</th>
                        <th>Giờ Mở Cửa</th>
                        <th>Trạng Thái</th>
                        <th class="pe-4 text-end">Thao Tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="b : ${branches}">
                        <td class="ps-4 fw-bold" th:text="${b.id}">1</td>
                        <td class="fw-semibold text-dark">
                            <i class="fa-solid fa-location-dot text-danger me-1"></i>
                            <span th:text="${b.name}">OneShop Quận 1</span>
                        </td>
                        <td class="text-muted small" th:text="${b.address}">Địa chỉ</td>
                        <td th:text="${b.phone}">0901234567</td>
                        <td><span class="badge bg-light text-dark border" th:text="${b.provinceCity}">TP.HCM</span></td>
                        <td class="small" th:text="${b.openHours}">08:30 - 22:00</td>
                        <td>
                            <span class="badge bg-success" th:if="${b.active}">Hoạt động</span>
                            <span class="badge bg-secondary" th:unless="${b.active}">Tạm đóng</span>
                        </td>
                        <td class="pe-4 text-end">
                            <a th:href="@{'/admin/branches/edit/' + ${b.id}}" class="btn btn-sm btn-outline-primary me-1 rounded-circle p-2" title="Chỉnh sửa">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </a>
                            <a th:href="@{'/admin/branches/delete/' + ${b.id}}" class="btn btn-sm btn-outline-danger rounded-circle p-2" 
                               onclick="return confirm('Bạn có chắc muốn xóa chi nhánh này?');" title="Xóa">
                                <i class="fa-solid fa-trash-can"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
