<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thông Tin Chi Nhánh - SkinViet Admin</title>
</head>
<body>

    <div class="mb-4">
        <a th:href="@{/admin/branches}" class="text-muted text-decoration-none small">
            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại danh sách chi nhánh
        </a>
        <h4 class="fw-bold mt-2" th:text="${branch.id != null ? 'Cập Nhật Chi Nhánh' : 'Thêm Chi Nhánh Mới'}">Thông Tin Chi Nhánh</h4>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="max-width: 700px;">
        <form th:action="@{/admin/branches/save}" method="post" th:object="${branch}">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label small fw-semibold">Tên Chi Nhánh *</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="Ví dụ: OneShop Thủ Đức, OneShop Cầu Giấy" required>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Địa Chỉ Chi Tiết *</label>
                <input type="text" th:field="*{address}" class="form-control" placeholder="Số nhà, đường, phường/xã" required>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Số Điện Thoại Hotline *</label>
                    <input type="tel" th:field="*{phone}" class="form-control" placeholder="0901234567" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Tỉnh / Thành Phố *</label>
                    <input type="text" th:field="*{provinceCity}" class="form-control" placeholder="TP.HCM, Hà Nội, Đà Nẵng..." required>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Giờ Hoạt Động</label>
                    <input type="text" th:field="*{openHours}" class="form-control" placeholder="08:30 - 22:00">
                </div>
                <div class="col-md-6 d-flex align-items-center mt-4">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeSwitch">
                        <label class="form-check-label fw-semibold" for="activeSwitch">Đang Hoạt Động</label>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger px-4 rounded-pill">Lưu Chi Nhánh</button>
                <a th:href="@{/admin/branches}" class="btn btn-outline-secondary px-4 rounded-pill">Hủy</a>
            </div>
        </form>
    </div>

</body>
</html>
