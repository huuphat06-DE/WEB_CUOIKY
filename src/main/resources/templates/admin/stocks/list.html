<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản Lý Tồn Kho Chuỗi - SkinViet Admin</title>
</head>
<body>

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h4 class="fw-bold m-0"><i class="fa-solid fa-boxes-stacked text-danger me-2"></i>Quản Lý Tồn Kho Đa Chi Nhánh</h4>
            <p class="text-muted small m-0">Kiểm tra và cập nhật số lượng tồn kho từng sản phẩm mỹ phẩm theo từng cửa hàng</p>
        </div>

        <!-- Dropdown chọn chi nhánh muốn quản lý -->
        <div class="d-flex align-items-center gap-2">
            <label class="fw-semibold small text-muted text-nowrap">Chọn Chi Nhánh:</label>
            <select class="form-select form-select-sm rounded-pill fw-bold border-danger" onchange="location = '/admin/stocks?branchId=' + this.value;">
                <option th:each="b : ${branches}" 
                        th:value="${b.id}" 
                        th:text="${b.name + ' (' + b.provinceCity + ')'}" 
                        th:selected="${selectedBranchId == b.id}">
                </option>
            </select>
        </div>
    </div>

    <!-- Alert -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
        <span th:text="${successMessage}">Thành công</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light small text-muted">
                    <tr>
                        <th class="ps-4">Sản Phẩm Mỹ Phẩm</th>
                        <th>Danh Mục</th>
                        <th>Loại Da</th>
                        <th>Giá Bán</th>
                        <th>Tổng Kho Toàn Chuỗi</th>
                        <th style="width: 260px;">Tồn Kho Tại Chi Nhánh Này</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td class="ps-4 py-3">
                            <div class="d-flex align-items-center gap-3">
                                <img th:src="${p.mainImage}" width="50" height="50" class="rounded-2 border" style="object-fit: cover;">
                                <div>
                                    <div class="fw-semibold text-dark" th:text="${p.name}">Tên sản phẩm</div>
                                    <div class="small text-muted" th:text="'SKU: ' + ${p.sku}">SKU</div>
                                </div>
                            </div>
                        </td>
                        <td><span class="badge bg-light text-dark border" th:text="${p.category != null ? p.category.name : '-'}">Danh mục</span></td>
                        <td><span class="badge bg-light text-danger border" th:text="${p.skinType}">Da dầu</span></td>
                        <td class="fw-semibold text-dark" th:text="${#numbers.formatDecimal(p.salePrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">300.000 đ</td>
                        <td>
                            <span class="badge bg-primary rounded-pill px-3 py-1" th:text="${p.getTotalStock()} + ' SP'">10 SP</span>
                        </td>
                        <td>
                            <!-- Form cập nhật số lượng tồn kho tại chi nhánh đang chọn -->
                            <form th:action="@{/admin/stocks/update}" method="post" class="d-flex align-items-center gap-2 m-0">
                                <input type="hidden" name="branchId" th:value="${selectedBranchId}">
                                <input type="hidden" name="productId" th:value="${p.id}">
                                <input type="number" name="quantity" class="form-control form-control-sm text-center rounded-pill" 
                                       th:value="${p.getStockAtBranch(selectedBranchId)}" min="0" max="9999" style="width: 90px;" required>
                                <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                                    <i class="fa-solid fa-floppy-disk me-1"></i> Lưu
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
