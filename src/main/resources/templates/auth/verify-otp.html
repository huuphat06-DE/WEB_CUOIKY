<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Mã OTP - SkinViet_MyPham Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/client.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 480px;">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white text-center">
            <!-- Brand Logo -->
            <div class="mb-3">
                <a class="brand-logo justify-content-center mb-2" th:href="@{/}">
                    <i class="fa-solid fa-gem text-danger"></i> SkinViet<span>_MyPham Shop</span>
                </a>
            </div>

            <!-- Tiến trình đăng ký 2 bước -->
            <div class="d-inline-flex align-items-center gap-2 bg-light px-3 py-1 rounded-pill small border mb-3">
                <span class="text-success fw-semibold"><i class="fa-solid fa-check me-1"></i>Bước 1: Điền thông tin</span>
                <i class="fa-solid fa-chevron-right text-muted" style="font-size: 0.75rem;"></i>
                <span class="badge bg-danger rounded-pill px-2 py-1"><i class="fa-solid fa-2 me-1"></i>Bước 2: Nhập mã OTP</span>
            </div>

            <!-- Header Icon & Title -->
            <div class="mb-3">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger-subtle text-danger mb-2" style="width: 70px; height: 70px;">
                    <i class="fa-regular fa-envelope-open fs-2"></i>
                </div>
                <h4 class="fw-bold m-0">Xác Thực Mã OTP</h4>
                <p class="text-muted small mt-2">
                    Mã xác nhận 6 chữ số đã được gửi đến địa chỉ:<br>
                    <strong class="text-dark" th:text="${email}">email@gmail.com</strong>
                </p>
            </div>

            <!-- Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small rounded-3 text-start" th:text="${errorMessage}"></div>
            <div th:if="${infoMessage}" class="alert alert-success py-2 small rounded-3 text-start" th:text="${infoMessage}"></div>
            <div th:if="${mailWarning}" class="alert alert-warning py-2 small rounded-3 text-start">
                <i class="fa-solid fa-triangle-exclamation me-1"></i> <span th:text="${mailWarning}"></span>
            </div>

            <!-- Form nhập OTP -->
            <form th:action="@{/auth/verify-otp}" method="post" class="my-3">
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-muted text-uppercase">Nhập mã OTP (6 số)</label>
                    <input type="text" name="otp" class="form-control form-control-lg text-center fw-bold fs-3 rounded-3" 
                           placeholder="••••••" maxlength="6" pattern="[0-9]{6}" required autofocus
                           style="letter-spacing: 8px; font-family: monospace;">
                    <div class="form-text small text-muted mt-2">Mã xác thực có hiệu lực trong vòng 5 phút</div>
                </div>

                <button type="submit" class="btn btn-primary-oneshop w-100 py-3 fs-6 mb-3">
                    <i class="fa-solid fa-shield-check me-2"></i> Xác nhận & Kích hoạt tài khoản
                </button>
            </form>

            <!-- Gửi lại mã OTP -->
            <div class="small text-muted mb-3">
                Chưa nhận được mã OTP trong hòm thư? 
                <a th:href="@{/auth/resend-otp}" class="text-danger fw-semibold text-decoration-none">
                    <i class="fa-solid fa-rotate-right me-1"></i> Gửi lại mã
                </a>
            </div>

            <div class="mt-4 pt-2 border-top small">
                <a th:href="@{/auth/register}" class="text-muted text-decoration-none">
                    <i class="fa-solid fa-arrow-left me-1"></i> Quay lại sửa thông tin đăng ký
                </a>
            </div>
        </div>
    </div>

</body>
</html>
