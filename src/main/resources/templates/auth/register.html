<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - SkinViet_MyPham Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/client.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 520px;">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <a class="brand-logo justify-content-center mb-2" th:href="@{/}">
                    <i class="fa-solid fa-gem text-danger"></i> SkinViet<span>_MyPham Shop</span>
                </a>
                <h4 class="fw-bold m-0">Tạo Tài Khoản Khách Hàng</h4>
                <p class="text-muted small mb-2">Nhận ngay ưu đãi thành viên và tích điểm theo chuỗi</p>
                
                <!-- Tiến trình đăng ký 2 bước -->
                <div class="d-inline-flex align-items-center gap-2 bg-light px-3 py-1 rounded-pill small border">
                    <span class="badge bg-danger rounded-pill px-2 py-1"><i class="fa-solid fa-1 me-1"></i>Điền thông tin</span>
                    <i class="fa-solid fa-chevron-right text-muted" style="font-size: 0.75rem;"></i>
                    <span class="text-muted"><i class="fa-regular fa-envelope me-1"></i>Bước 2: Nhập mã OTP Gmail</span>
                </div>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger py-2 small rounded-3" th:text="${errorMessage}"></div>

            <form th:action="@{/auth/register}" method="post" th:object="${registerForm}">
                <div class="row g-3 mb-3">
                    <div class="col-12">
                        <label class="form-label small fw-semibold">Họ và tên của bạn *</label>
                        <input type="text" th:field="*{fullName}" class="form-control rounded-3" placeholder="Nguyễn Văn A" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Tên đăng nhập *</label>
                        <input type="text" th:field="*{username}" class="form-control rounded-3" placeholder="username123" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Số điện thoại *</label>
                        <input type="tel" th:field="*{phone}" class="form-control rounded-3" placeholder="0912345678" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-semibold">Email nhận mã OTP *</label>
                        <input type="email" th:field="*{email}" class="form-control rounded-3" placeholder="email@gmail.com" required>
                        <div class="form-text small text-muted"><i class="fa-regular fa-envelope text-danger me-1"></i>Mã OTP 6 số sẽ được gửi về hộp thư Gmail này để kích hoạt tài khoản.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Mật khẩu *</label>
                        <input type="password" th:field="*{password}" class="form-control rounded-3" placeholder="••••••••" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Xác nhận mật khẩu *</label>
                        <input type="password" th:field="*{confirmPassword}" class="form-control rounded-3" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-oneshop w-100 py-2 fs-6 mb-3">
                    <i class="fa-solid fa-paper-plane me-2"></i> Tiếp tục & Nhận mã OTP qua Email
                </button>
            </form>

            <div class="text-center small text-muted">
                Đã có tài khoản? <a th:href="@{/auth/login}" class="text-danger fw-semibold text-decoration-none">Đăng nhập ngay</a>
            </div>
        </div>
    </div>

</body>
</html>
