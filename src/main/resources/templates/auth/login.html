<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Chuỗi Mỹ Phẩm SkinViet_MyPham Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/client.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 460px;">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
            <!-- Brand Logo -->
            <div class="text-center mb-4">
                <a class="brand-logo justify-content-center mb-2" th:href="@{/}">
                    <i class="fa-solid fa-gem text-danger"></i> SkinViet<span>_MyPham Shop</span>
                </a>
                <p class="text-muted small">Hệ thống chuỗi bán lẻ mỹ phẩm chính hãng</p>
            </div>

            <!-- Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small rounded-3" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success py-2 small rounded-3" th:text="${successMessage}"></div>
            <div th:if="${infoMessage}" class="alert alert-info py-2 small rounded-3" th:text="${infoMessage}"></div>

            <!-- Login Form -->
            <form th:action="@{/auth/login}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted text-uppercase">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
                        <input type="text" id="loginUsername" name="username" class="form-control border-start-0" placeholder="Nhập tên đăng nhập" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-muted text-uppercase">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" id="loginPassword" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-oneshop w-100 py-2 fs-6 mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Đăng nhập ngay
                </button>
            </form>

            <div class="text-center small text-muted">
                Chưa có tài khoản? <a th:href="@{/auth/register}" class="text-danger fw-semibold text-decoration-none">Đăng ký ngay</a>
            </div>
            <div class="text-center small mt-2">
                <a th:href="@{/}" class="text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Quay về trang chủ</a>
            </div>
        </div>
    </div>
</body>
</html>
